name: Populate prototype with original Boudie Eats photos
on:
  push:
    branches: [prototype/what-to-eat-community]
    paths:
      - '.github/workflows/what-to-eat-photos.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract-photos:
    if: github.ref == 'refs/heads/prototype/what-to-eat-community'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prototype/what-to-eat-community
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image conversion
        run: python -m pip install 'Pillow>=10,<13'
      - name: Extract only selected original food photographs
        run: python prototypes/what-to-eat/extract-original-photos.py
      - name: Commit extracted prototype photos to the prototype branch only
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f prototypes/what-to-eat/assets
          if ! git diff --cached --quiet; then
            git commit -m 'Prototype: include original Boudie Eats photo assets'
            git push origin HEAD:refs/heads/prototype/what-to-eat-community
          fi
