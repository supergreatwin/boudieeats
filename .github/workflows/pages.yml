name: Publish BoudieEats

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v6
      - name: Extract the Astro project
        run: tar -xzf boudieeats-source.tar.gz
      - name: Correct restaurant and café review titles
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root = Path("boudieeats/src/content/reviews")
          updates = {
              "takeaway-bowls.md": ("تيك أواي في العربية", "فول طبالي"),
              "cafe-iced-coffee.md": ("قهوة ساقعة جنب الشباك", "آيسد كوفي سيلانترو"),
              "cafe-hot-coffee.md": ("فنجان قهوة في الكافيه", "فلات وايت La Mie"),
          }
          for filename, (previous, corrected) in updates.items():
              path = root / filename
              current = path.read_text(encoding="utf-8")
              old_line = f'title: "{previous}"'
              new_line = f'title: "{corrected}"'
              if current.count(old_line) != 1:
                  raise RuntimeError(f"Unexpected title in {path}")
              path.write_text(current.replace(old_line, new_line, 1), encoding="utf-8")
              print(f"Updated {filename}: {corrected}")
          PY
      - name: Inspect editorial content layout
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root = Path("boudieeats/src")
          print("===== EDITORIAL FILE PATHS =====")
          for p in sorted(root.rglob("*")):
              if p.is_file() and ("/content/" in str(p) or "/pages/" in str(p)):
                  print(p)
          print("===== EDITORIAL SOURCE SAMPLES =====")
          files = [
              root/"content/reviews/takeaway-bowls.md",
              root/"content/reviews/cafe-iced-coffee.md",
              root/"content/reviews/cafe-hot-coffee.md",
              root/"content/config.ts",
              root/"content.config.ts",
          ]
          for sub in ("stories", "articles", "journal"):
              folder = root/"content"/sub
              if folder.exists(): files.extend(list(sorted(folder.glob("*.md")))[:2])
          for p in files:
              if p.exists():
                  print(f"===== FILE {p} =====")
                  print(p.read_text(encoding="utf-8")[:7000])
          PY
      - uses: actions/setup-node@v6
        with:
          node-version-file: boudieeats/.node-version
          cache: npm
          cache-dependency-path: boudieeats/package-lock.json
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        id: pages
      - name: Install dependencies
        run: npm ci
        working-directory: boudieeats
      - name: Build the site
        run: npm run build
        working-directory: boudieeats
        env:
          ASTRO_TELEMETRY_DISABLED: '1'
          SITE_URL: ${{ steps.pages.outputs.origin }}
          SITE_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          PUBLIC_INDEXABLE: 'true'
      - uses: actions/upload-pages-artifact@v4
        with:
          path: boudieeats/dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
