name: Publish BoudieEats

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v6
      - name: Extract the Astro project
        run: tar -xzf boudieeats-source.tar.gz
      - name: Inspect editable review content
        run: |
          echo "=== REVIEW FILE PATHS ==="
          find boudieeats/src -type f | grep -Ei 'review|content|data' | head -n 80 || true
          echo "=== REVIEW TEXT MATCHES ==="
          grep -RinE 'taste-test|tabali|طبالي|سيلانترو|cilantro|flat white|فلات وايت|la mie|مطاعم|كافيهات|فول' boudieeats/src --include='*.astro' --include='*.ts' --include='*.js' --include='*.json' --include='*.md' | head -n 130 || true
      - uses: actions/setup-node@v6
        with:
          node-version-file: boudieeats/.node-version
          cache: npm
          cache-dependency-path: boudieeats/package-lock.json
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        id: pages
      - name: Install dependencies
        run: npm ci
        working-directory: boudieeats
      - name: Build the site
        run: npm run build
        working-directory: boudieeats
        env:
          ASTRO_TELEMETRY_DISABLED: '1'
          SITE_URL: ${{ steps.pages.outputs.origin }}
          SITE_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          PUBLIC_INDEXABLE: 'true'
      - uses: actions/upload-pages-artifact@v4
        with:
          path: boudieeats/dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
