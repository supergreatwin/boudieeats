name: Verify private What to Eat
on:
  pull_request:
    paths:
      - "tools/**"
      - "supabase/what-to-eat*.sql"
      - "assets/what-to-eat-*"
      - ".github/workflows/verify-what-to-eat.yml"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: tools/astro/package-lock.json
      - name: Verify script syntax
        run: |
          node --check tools/what-to-eat-client.mjs
          node --check tools/what-to-eat-pages.mjs
          node --check tools/build-pages.mjs
          node --check tools/verify-what-to-eat.mjs
          node --check tools/verify-what-to-eat-runtime.mjs
      - name: Build private preview
        run: node tools/build-pages.mjs
        env:
          SITE_URL: https://boudieeats.com
          SITE_BASE_PATH: /
          BE_SUPABASE_URL: https://vktegxiycqwqnnqpxiuh.supabase.co
      - name: Verify generated sections
        run: |
          node tools/verify-what-to-eat.mjs
          node tools/verify-what-to-eat-runtime.mjs
          node tools/verify-what-to-eat-public-api.mjs
          node tools/verify-accounts.mjs
          node tools/verify-publishing.mjs
